name: Daily SHIFT Sync

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Fecha YYYY-MM-DD (vacio = ayer)"
        required: false
        default: ""

# Sin esto, un dispatch manual mientras corre el cron programado (o el
# weekly-reload pisando el mismo dia) puede solaparse: el sync de labor hace
# un delete-then-insert por tienda/dia, y dos corridas concurrentes sobre la
# misma ventana pueden borrarse turnos recien escritos entre si.
concurrency:
  group: shift-daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolver fecha
        id: fecha
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ISO="${{ github.event.inputs.date }}"
          else
            ISO=$(TZ=America/Chicago date -d "yesterday" +%Y-%m-%d)
          fi
          echo "iso=$ISO" >> $GITHUB_OUTPUT
          echo "business=$(echo $ISO | tr -d '-')" >> $GITHUB_OUTPUT
          echo "Sincronizando $ISO"

      - name: Traer lista de tiendas
        run: |
          curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/stores?active=eq.true&toast_guid=not.is.null&select=code,toast_guid" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -o stores.json
          COUNT=$(jq 'length' stores.json)
          echo "Tiendas activas: $COUNT"
          if [ "$COUNT" -lt 1 ]; then echo "Sin tiendas, abortando"; exit 1; fi

      - name: Sincronizar cada tienda
        run: |
          ISO="${{ steps.fecha.outputs.iso }}"
          BUSINESS="${{ steps.fecha.outputs.business }}"
          OK=0; FAIL=0; FAILED_LIST=""
          : > synced-codes.txt

          # Resolved once and printed to the summary below, never the secret.
          APP_HOST=$(echo "${{ secrets.APP_URL }}" | sed -E 's#^[a-zA-Z]+://##; s#/.*##')

          for row in $(jq -r '.[] | @base64' stores.json); do
            CODE=$(echo $row | base64 -d | jq -r '.code')
            GUID=$(echo $row | base64 -d | jq -r '.toast_guid')

            SUCCESS=0
            for attempt in 1 2 3; do
              RESP=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.APP_URL }}/api/toast/sync-store" \
                -H "Content-Type: application/json" \
                -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}" \
                -d "{\"storeCode\":$CODE,\"restaurantGuid\":\"$GUID\",\"businessDate\":\"$BUSINESS\",\"isoDate\":\"$ISO\"}")
              HTTP=$(echo "$RESP" | tail -n1)
              BODY=$(echo "$RESP" | sed '$d')
              # A 200 only counts as success if the body agrees, not just the
              # HTTP status. ok now reflects the transactions/hourly writes
              # too (see app/api/toast/sync-store/route.js), not just labor
              # and sales, so this check is finally trustworthy end to end.
              BODY_OK=$(echo "$BODY" | jq -r '.ok // false' 2>/dev/null || echo false)
              if [ "$HTTP" = "200" ] && [ "$BODY_OK" = "true" ]; then
                SALES=$(echo "$BODY" | jq -r '.grossSales')
                echo "OK $CODE -> \$$SALES"
                SUCCESS=1
                break
              fi
              echo "Intento $attempt fallo para $CODE (HTTP $HTTP): $(echo "$BODY" | jq -r '.error // .transactionError // .hourlyError // "sin detalle"' 2>/dev/null)"
              sleep 5
            done

            if [ "$SUCCESS" = "1" ]; then
              OK=$((OK+1))
              echo "$CODE" >> synced-codes.txt
            else
              FAIL=$((FAIL+1)); FAILED_LIST="$FAILED_LIST $CODE"
              echo "::error::Store $CODE failed to sync for $ISO"
            fi
            sleep 1
          done

          echo "### Sync $ISO" >> $GITHUB_STEP_SUMMARY
          echo "App host: $APP_HOST" >> $GITHUB_STEP_SUMMARY
          echo "Exitosas: $OK" >> $GITHUB_STEP_SUMMARY
          echo "Fallidas: $FAIL" >> $GITHUB_STEP_SUMMARY
          if [ "$FAIL" -gt 0 ]; then
            echo "Fallidas:$FAILED_LIST" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Verificar cobertura completa
        run: |
          # La lista de tiendas a intentar (paso "Traer lista de tiendas") ya
          # viene filtrada por toast_guid: una tienda recien abierta a la que
          # se le olvido cargar el GUID nunca aparece ahi, nunca falla, y
          # nunca se nota. Esta verificacion compara contra CADA fila de
          # stores, sin filtro - la unica fuente de verdad de que tiendas
          # estan abiertas - para que ese olvido sea un rojo, no un silencio.
          curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/stores?select=code" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -o all-stores.json
          jq -r '.[].code' all-stores.json | sort -n > expected-codes.txt
          sort -n synced-codes.txt | uniq > actual-codes.txt
          EXPECTED_COUNT=$(wc -l < expected-codes.txt)
          ACTUAL_COUNT=$(wc -l < actual-codes.txt)
          MISSING=$(comm -23 expected-codes.txt actual-codes.txt)

          echo "### Cobertura $ISO" >> $GITHUB_STEP_SUMMARY
          echo "Tiendas en la tabla stores: $EXPECTED_COUNT · Sincronizadas hoy: $ACTUAL_COUNT" >> $GITHUB_STEP_SUMMARY

          if [ -n "$MISSING" ]; then
            MISSING_LIST=$(echo "$MISSING" | tr '\n' ' ')
            echo "::error::Cobertura incompleta: faltan las tiendas$MISSING_LIST de $EXPECTED_COUNT esperadas"
            echo "Faltan: $MISSING_LIST" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "Cobertura completa: $ACTUAL_COUNT/$EXPECTED_COUNT tiendas"
        env:
          ISO: ${{ steps.fecha.outputs.iso }}
