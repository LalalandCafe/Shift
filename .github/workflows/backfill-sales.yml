name: Backfill Sales (manual)

# Manual-only historical backfill for daily_sales / daily_transactions /
# hourly_sales. Never runs on a schedule - only a human dispatching it.
#
# Reuses the exact same secrets and the exact same write path as
# daily-sync.yml (POST /api/toast/sync-store with x-sync-secret), so a
# backfilled month is computed identically to a month the daily cron wrote.
# The one deliberate difference: this always sends skipKitchen:true. That
# flag is already read by the route (app/api/toast/sync-store/route.js) and
# only turns off the kitchen/prep-station fetch and writes, which are
# independent of gross_sales/transactions/hourly_sales (they run in a
# separate Promise.all branch and write to separate tables). It does not
# change how sales are computed - it just avoids ~35 x N days of pointless
# Toast calls for kitchen data nobody asked to backfill.
#
# daily_transactions is NOT a separate load: computeSalesTransactionsAndHours
# in the sync route computes gross sales AND transaction count from the same
# single ordersBulk pass, and the route writes both tables (in their own
# try/catch each) from that one call. This workflow gets daily_transactions
# for free from every store/day pair it already syncs.
#
# Unlike backfill-toast.sh (which only checks HTTP 200), this checks the
# response body's "ok" field too, same as daily-sync.yml already does -
# HTTP 200 with ok:false (a transactionError or hourlyError) does NOT count
# as success here.
#
# Chunking: start_date/end_date can span any range. They're split
# internally into sequential chunks of at most CHUNK_DAYS days each (the
# old 45-day limit no longer rejects the dispatch - it's now a per-chunk
# size, enforced by construction when the chunk plan is built, not a
# validation that can fail). Chunks run one after another, never in
# parallel - only the per-day, per-store fan-out within a chunk is
# parallel, unchanged from before. A chunk with failed pairs does not stop
# the run: the outer chunk loop and the per-day sync loop are both
# deliberately insulated from a failing pair's exit code (see the `|| true`
# on the xargs pipeline below) so this script's own `set -e` (the GitHub
# Actions bash default) can't kill a 300-day run because one store had one
# bad day. Every failure is still recorded in failed-pairs.txt and in the
# final summary - nothing is silently swallowed, just not fatal.
#
# dry_run: prints the chunk plan (and nothing else - no store list fetch,
# no Toast calls, no artifact) and exits 0. Use it to sanity-check a large
# range's chunk boundaries before actually running it.

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date YYYY-MM-DD (inclusive)"
        required: true
      end_date:
        description: "End date YYYY-MM-DD (inclusive)"
        required: true
      store_code:
        description: "Optional: single store code to backfill. Blank = all active stores."
        required: false
        default: ""
      dry_run:
        description: "Print the chunk plan and exit without calling Toast"
        required: false
        type: boolean
        default: false

concurrency:
  group: shift-backfill-sales
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # Runs first, unconditionally, before anything else has a chance to
      # fail. This is the actual fix for the artifact upload reporting "No
      # files were found": previously these three files were only created
      # inside the "Backfill" step, so if "Validate inputs" or "Traer lista
      # de tiendas" failed first, "Backfill" never ran, the files never
      # existed, and "Upload logs" (which does run on failure, via
      # if: always()) had nothing to find. Creating them here means every
      # later failure, no matter how early, still leaves something real to
      # upload.
      - name: Prepare log files
        run: |
          : > full-log.txt
          : > synced-pairs.txt
          : > failed-pairs.txt
          : > anomaly-pairs.txt
          : > skipped-refunds.txt
          : > void-discounts.txt

      - name: Validate inputs and plan chunks
        id: validate
        run: |
          START="${{ github.event.inputs.start_date }}"
          END="${{ github.event.inputs.end_date }}"
          STORE="${{ github.event.inputs.store_code }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          CHUNK_DAYS=45

          for d in "$START" "$END"; do
            if ! [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::'$d' is not a valid YYYY-MM-DD date"
              exit 1
            fi
            if ! date -d "$d" >/dev/null 2>&1; then
              echo "::error::'$d' does not parse as a real calendar date"
              exit 1
            fi
          done

          if [ -n "$STORE" ] && ! [[ "$STORE" =~ ^[0-9]+$ ]]; then
            echo "::error::store_code must be numeric, got '$STORE'"
            exit 1
          fi

          START_EPOCH=$(date -d "$START" +%s)
          END_EPOCH=$(date -d "$END" +%s)
          if [ "$END_EPOCH" -lt "$START_EPOCH" ]; then
            echo "::error::end_date ($END) is before start_date ($START)"
            exit 1
          fi
          TOTAL_DAYS=$(( (END_EPOCH - START_EPOCH) / 86400 + 1 ))

          # Split [START, END] into consecutive, non-overlapping windows of
          # at most CHUNK_DAYS days each, oldest first. The 45-day guard is
          # now this construction itself - every chunk this loop produces
          # is <= CHUNK_DAYS by definition, so there's nothing left to
          # reject a big dispatch for.
          CHUNKS="[]"
          CURSOR="$START"
          while [[ "$CURSOR" < "$END" || "$CURSOR" == "$END" ]]; do
            CHUNK_END_EPOCH=$(( $(date -d "$CURSOR" +%s) + (CHUNK_DAYS - 1) * 86400 ))
            CHUNK_END=$(date -d "@$CHUNK_END_EPOCH" +%Y-%m-%d)
            if [[ "$CHUNK_END" > "$END" ]]; then CHUNK_END="$END"; fi
            DAYS=$(( ( $(date -d "$CHUNK_END" +%s) - $(date -d "$CURSOR" +%s) ) / 86400 + 1 ))
            CHUNKS=$(echo "$CHUNKS" | jq -c --arg s "$CURSOR" --arg e "$CHUNK_END" --argjson d "$DAYS" \
              '. + [{start: $s, end: $e, days: $d}]')
            CURSOR=$(date -d "$CHUNK_END +1 day" +%Y-%m-%d)
          done

          CHUNK_COUNT=$(echo "$CHUNKS" | jq 'length')

          echo "Rango total: $START a $END ($TOTAL_DAYS dias) | tienda: ${STORE:-todas} | dry_run: $DRY_RUN"
          echo "Plan: $CHUNK_COUNT chunk(s) de hasta $CHUNK_DAYS dias cada uno"
          echo "$CHUNKS" | jq -r 'to_entries[] | "  chunk \(.key + 1) of '"$CHUNK_COUNT"': \(.value.start) a \(.value.end) (\(.value.days) dias)"'

          {
            echo "### Backfill plan: $START a $END ($TOTAL_DAYS dias total)"
            echo "Tienda: ${STORE:-todas} | dry_run: $DRY_RUN"
            echo ""
            echo "| Chunk | Start | End | Days |"
            echo "|---|---|---|---|"
            echo "$CHUNKS" | jq -r 'to_entries[] | "| \(.key + 1) | \(.value.start) | \(.value.end) | \(.value.days) |"'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "store=$STORE" >> "$GITHUB_OUTPUT"
          echo "chunks_json=$CHUNKS" >> "$GITHUB_OUTPUT"
          echo "chunk_count=$CHUNK_COUNT" >> "$GITHUB_OUTPUT"

      - name: Traer lista de tiendas
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          # opened_at comes along here (not just code/toast_guid) so the
          # per-day loop below can skip a store on any date before it
          # actually opened - see the Backfill step's jq filter.
          # Backfilling a store for dates before it opened isn't just
          # pointless: Toast returns zero orders for that date, and the
          # sync route's daily_sales/daily_transactions upserts are
          # unconditional, so it writes a real $0 row that then has to be
          # filtered back out by the weekly SSSG comparability rule
          # instead of never existing. Confirmed live: run 33800079982
          # (Backfill Sales, 2025-08-01..2025-08-31, all stores, run before
          # this fix existed) left exactly 391 such rows across 12 stores
          # that hadn't opened yet during that range.
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/stores?active=eq.true&toast_guid=not.is.null&select=code,toast_guid,opened_at" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -o stores.json

          STORE="${{ steps.validate.outputs.store }}"
          if [ -n "$STORE" ]; then
            jq --argjson c "$STORE" '[.[] | select(.code == $c)]' stores.json > stores.filtered.json
            mv stores.filtered.json stores.json
          fi

          STORE_COUNT=$(jq 'length' stores.json)
          echo "Tiendas a procesar: $STORE_COUNT"
          if [ "$STORE_COUNT" -lt 1 ]; then
            echo "::error::Ninguna tienda coincide (revisa active/toast_guid o el store_code pedido)"
            exit 1
          fi

      - name: Backfill
        id: backfill
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          CHUNKS_JSON='${{ steps.validate.outputs.chunks_json }}'
          CHUNK_COUNT="${{ steps.validate.outputs.chunk_count }}"
          PARALLEL=4

          sync_one() {
            local code="$1" guid="$2" iso="$3"
            local business="${iso//-/}"

            for attempt in 1 2 3; do
              resp=$(curl -s -m 120 -w "\n%{http_code}" -X POST "${{ secrets.APP_URL }}/api/toast/sync-store" \
                -H "Content-Type: application/json" \
                -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}" \
                -d "{\"storeCode\":$code,\"restaurantGuid\":\"$guid\",\"businessDate\":\"$business\",\"isoDate\":\"$iso\",\"skipKitchen\":true}")
              http=$(echo "$resp" | tail -n1)
              body=$(echo "$resp" | sed '$d')
              body_ok=$(echo "$body" | jq -r '.ok // false' 2>/dev/null || echo false)

              if [ "$http" = "200" ] && [ "$body_ok" = "true" ]; then
                sales=$(echo "$body" | jq -r '.grossSales // "?"')
                txns=$(echo "$body" | jq -r '.transactionCount // "?"')
                hourly=$(echo "$body" | jq -r '.hourlyRowsWritten // "?"')
                labor=$(echo "$body" | jq -r '.laborEntriesSynced // "?"')
                # Componentes de net sales. El route los calcula en el mismo
                # recorrido que gross (no cuesta una llamada extra a Toast) -
                # ver lib/toast.js. net es informativo: la columna real la
                # genera Postgres a partir de los dos componentes.
                disc=$(echo "$body" | jq -r '.discountsTotal // "?"')
                refu=$(echo "$body" | jq -r '.refundsTotal // "?"')
                net=$(echo "$body" | jq -r '.netSales // "?"')
                anom=$(echo "$body" | jq -r '.fieldAnomalyCount // 0')
                # Reembolsos que Toast atribuye a OTRO dia. No entran en el
                # net de este dia (correcto), pero tampoco entran en el del
                # dia que les toca, porque ese pull trae ordenes por fecha de
                # ORDEN. Sesgo de una sola direccion: net siempre alto.
                skipn=$(echo "$body" | jq -r '.refundsSkippedOtherDateCount // 0')
                skipa=$(echo "$body" | jq -r '.refundsSkippedOtherDateAmount // 0')
                # Descuentos que Toast YA QUITO (processingState VOID /
                # PENDING_VOID) y que por eso no entran en discounts. Hasta el
                # 2026-09-16 se estaban sumando, y eran EXACTAMENTE la
                # diferencia contra el Sales Summary de Toast en los dos dias
                # de control. Se loguea para que el tamano de esto se vea en
                # cada corrida en vez de descubrirse otra vez dentro de un ano.
                vdn=$(echo "$body" | jq -r '.discountsSkippedVoidCount // 0')
                vda=$(echo "$body" | jq -r '.discountsSkippedVoidAmount // 0')
                echo "OK   $code $iso grossSales=\$$sales discounts=\$$disc refunds=\$$refu net=\$$net transactions=$txns hourlyRows=$hourly laborRows=$labor anomalies=$anom skippedRefunds=$skipn/\$$skipa voidDiscounts=$vdn/\$$vda" >> full-log.txt
                echo "$code:$iso" >> synced-pairs.txt

                # Un campo con forma inesperada (un refund sin refundAmount,
                # por ejemplo) NO tumba el par - seria absurdo que una
                # variacion benigna del schema de Toast reventara un backfill
                # de un año entero. Pero tampoco puede quedar enterrado a
                # mitad del log: se anota aparte para el resumen final.
                if [ "$anom" != "0" ] && [ "$anom" != "null" ]; then
                  echo "$code:$iso count=$anom" >> anomaly-pairs.txt
                  echo "$body" | jq -r '.fieldAnomalies[]? | "     ANOMALY '"$code $iso"': \(.)"' >> full-log.txt
                fi

                if [ "$skipn" != "0" ] && [ "$skipn" != "null" ]; then
                  echo "$code:$iso count=$skipn amount=$skipa" >> skipped-refunds.txt
                fi

                if [ "$vdn" != "0" ] && [ "$vdn" != "null" ]; then
                  echo "$code:$iso count=$vdn amount=$vda" >> void-discounts.txt
                fi
                return 0
              fi

              reason=$(echo "$body" | jq -r '.error // .transactionError // .hourlyError // "sin detalle"' 2>/dev/null)
              echo "RETRY $code $iso intento=$attempt http=$http ok=$body_ok razon=$reason" >> full-log.txt

              if [ "$http" = "429" ]; then
                sleep $(( attempt * 20 ))
              else
                sleep $(( attempt * 5 ))
              fi
            done

            final_reason=$(echo "$body" | jq -r '.error // .transactionError // .hourlyError // "sin detalle"' 2>/dev/null)
            echo "FAIL $code $iso http=$http ok=$body_ok razon=$final_reason" >> full-log.txt
            echo "$code:$iso http=$http reason=$final_reason" >> failed-pairs.txt
            return 1
          }
          export -f sync_one

          CHUNK_NUM=0
          CHUNKS_OK=0
          CHUNKS_WITH_FAILURES=0

          # Process substitution (< <(...)), not a `| while` pipe, so
          # CHUNK_NUM/CHUNKS_OK/etc set inside this loop are still visible
          # after it ends - a piped while would run in a subshell and lose
          # them.
          while IFS= read -r chunk; do
            CHUNK_NUM=$(( CHUNK_NUM + 1 ))
            CSTART=$(echo "$chunk" | jq -r '.start')
            CEND=$(echo "$chunk" | jq -r '.end')

            echo ""
            echo "================================================"
            echo "Chunk $CHUNK_NUM of $CHUNK_COUNT: $CSTART to $CEND"
            echo "================================================"
            {
              echo ""
              echo "=== Chunk $CHUNK_NUM of $CHUNK_COUNT: $CSTART to $CEND ==="
            } >> full-log.txt

            FAIL_BEFORE=$(wc -l < failed-pairs.txt)

            DATES=()
            CUR="$CEND"
            while [[ "$CUR" > "$CSTART" || "$CUR" == "$CSTART" ]]; do
              DATES+=("$CUR")
              CUR=$(date -d "$CUR -1 day" +%Y-%m-%d)
            done

            day_num=0
            for iso in "${DATES[@]}"; do
              day_num=$(( day_num + 1 ))

              # A store with no opened_at, or one that opens after this
              # day, is skipped entirely for this date - never synced,
              # never written. Prevents the exact phantom-$0-row pattern
              # found in run 33800079982: syncing a store for a date
              # before it existed just gets a real zero from Toast, which
              # then has to be excluded by hand downstream instead of
              # never existing.
              TODAY_STORES=$(jq -c --arg d "$iso" '[.[] | select(.opened_at != null and .opened_at <= $d)]' stores.json)
              SKIPPED=$(( $(jq 'length' stores.json) - $(echo "$TODAY_STORES" | jq 'length') ))

              echo "[chunk $CHUNK_NUM/$CHUNK_COUNT day $day_num/${#DATES[@]}] $iso ($SKIPPED not yet open, skipped)"

              # `|| true`: a store/day pair failing all 3 retries makes
              # sync_one return 1, which makes xargs exit 123. Without this
              # guard, GitHub Actions' default `bash -e -o pipefail` would
              # kill this whole step - and every remaining chunk - the
              # first time any single pair permanently fails. The failure
              # is still fully recorded in full-log.txt/failed-pairs.txt by
              # sync_one itself; this only stops that failure from being
              # fatal to the script.
              echo "$TODAY_STORES" | jq -r '.[] | "\(.code) \(.toast_guid)"' \
                | xargs -P "$PARALLEL" -I {} bash -c 'set -- {}; sync_one "$1" "$2" "'"$iso"'"' \
                || true
              sleep 2
            done

            FAIL_AFTER=$(wc -l < failed-pairs.txt)
            if [ "$FAIL_AFTER" -gt "$FAIL_BEFORE" ]; then
              CHUNKS_WITH_FAILURES=$(( CHUNKS_WITH_FAILURES + 1 ))
              echo "Chunk $CHUNK_NUM finished with $(( FAIL_AFTER - FAIL_BEFORE )) failed pair(s)"
            else
              CHUNKS_OK=$(( CHUNKS_OK + 1 ))
              echo "Chunk $CHUNK_NUM finished clean"
            fi
          done < <(echo "$CHUNKS_JSON" | jq -c '.[]')

          OK_COUNT=$(wc -l < synced-pairs.txt)
          FAIL_COUNT=$(wc -l < failed-pairs.txt)

          # Anomalias de campo: pares afectados y total de hallazgos. Se
          # reportan SIEMPRE al final, incluso en cero - el silencio no puede
          # ser ambiguo. Un backfill de un año escribe ~12.000 lineas y nadie
          # las scrollea, asi que 4.000 anomalias enterradas a mitad del log
          # serian invisibles en la practica.
          ANOMALY_PAIRS=$(wc -l < anomaly-pairs.txt)
          ANOMALY_TOTAL=$(awk -F'count=' '{s += $2} END {print s+0}' anomaly-pairs.txt)

          # Reembolsos saltados por pertenecer a otro dia. Mismo trato que las
          # anomalias: se reportan SIEMPRE al final, incluso en cero. Esto no
          # es un error - es el sesgo conocido de una sola direccion, y este
          # es el instrumento que lo mide en dolares en vez de estimarlo
          # restando contra un export de Toast.
          SKIPPED_PAIRS=$(wc -l < skipped-refunds.txt)
          SKIPPED_COUNT=$(awk -F'count=' '{split($2,a," "); s += a[1]} END {print s+0}' skipped-refunds.txt)
          SKIPPED_AMOUNT=$(awk -F'amount=' '{s += $2} END {printf "%.2f", s+0}' skipped-refunds.txt)

          # Descuentos VOID/PENDING_VOID excluidos. Mismo trato: se reportan
          # SIEMPRE, incluso en cero. Esto NO es un sesgo pendiente como los
          # reembolsos de arriba - es dinero correctamente excluido. Se mide
          # porque hasta el 2026-09-16 se estaba SUMANDO, y era exactamente la
          # diferencia contra el Sales Summary de Toast.
          VOID_PAIRS=$(wc -l < void-discounts.txt)
          VOID_COUNT=$(awk -F'count=' '{split($2,a," "); s += a[1]} END {print s+0}' void-discounts.txt)
          VOID_AMOUNT=$(awk -F'amount=' '{s += $2} END {printf "%.2f", s+0}' void-discounts.txt)

          STORE_LABEL="${{ steps.validate.outputs.store }}"
          [ -z "$STORE_LABEL" ] && STORE_LABEL="todas"

          {
            echo ""
            echo "### Backfill summary (tienda: $STORE_LABEL)"
            echo "Chunks attempted: $CHUNK_COUNT"
            echo "Chunks succeeded (zero failed pairs): $CHUNKS_OK"
            echo "Chunks with at least one failure: $CHUNKS_WITH_FAILURES"
            echo "Store/day pairs written: $OK_COUNT"
            echo "Store/day pairs failed: $FAIL_COUNT"
            if [ "$FAIL_COUNT" -gt 0 ]; then
              echo ""
              echo "Fallidos (revisa failed-pairs.txt en el artifact para reintentar solo esos):"
              echo '```'
              cat failed-pairs.txt
              echo '```'
            fi

            echo ""
            if [ "$ANOMALY_PAIRS" -eq 0 ]; then
              echo "**0 field anomalies across the whole run.** Every discount and refund"
              echo "field Toast returned had the expected shape."
            else
              echo "**$ANOMALY_TOTAL field anomalies across $ANOMALY_PAIRS store/day pair(s).**"
              echo ""
              echo "These did NOT fail their pair - the sync wrote, and gross/transactions"
              echo "are unaffected. But discounts or refunds on these pairs may be"
              echo "understated, which moves net_sales by amounts too small to notice on a"
              echo "dashboard. Grep full-log.txt for ANOMALY in the artifact for the detail."
              echo ""
              echo '```'
              cat anomaly-pairs.txt
              echo '```'
            fi

            echo ""
            if [ "$SKIPPED_PAIRS" -eq 0 ]; then
              echo "**0 refunds skipped for belonging to another business date.**"
              echo "Every refund Toast returned was issued on the same day as its order."
            else
              echo "**$SKIPPED_COUNT refund(s) totalling \$$SKIPPED_AMOUNT skipped across $SKIPPED_PAIRS store/day pair(s)**"
              echo "because Toast attributes them to a different business date than their order."
              echo ""
              echo "This is NOT a failure and NOT malformed data. Toast attributes a refund to"
              echo "the day it was issued, not the day of the original order, so these correctly"
              echo "do not count toward this day. But they are not counted on their own day"
              echo "either - that day's pull returns orders by ORDER date, and these orders"
              echo "belong to other days. So they are missing from net_sales entirely, which"
              echo "always overstates net and never understates it."
              echo ""
              echo "\$$SKIPPED_AMOUNT is the measured size of that bias for this run."
              echo ""
              echo '```'
              cat skipped-refunds.txt
              echo '```'
            fi

            echo ""
            if [ "$VOID_PAIRS" -eq 0 ]; then
              echo "**0 voided discounts excluded.** No discount Toast had already"
              echo "removed appeared in any pair this run."
            else
              echo "**$VOID_COUNT voided discount(s) totalling \$$VOID_AMOUNT excluded across $VOID_PAIRS store/day pair(s)**"
              echo "because Toast had already removed them (processingState VOID or PENDING_VOID)."
              echo ""
              echo "This is money correctly NOT subtracted, not a pending gap. It is reported"
              echo "because these were being counted until 2026-09-16, and they were exactly"
              echo "the difference against Toast's Sales Summary on both gate days (7.05 on"
              echo "10001/2026-09-14, 7.32 on 10037/2026-08-28). If this number ever collapses"
              echo "to zero across a whole run, suspect that processingState stopped being"
              echo "populated rather than that voids stopped happening."
              echo ""
              echo '```'
              cat void-discounts.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          if [ "$ANOMALY_PAIRS" -eq 0 ]; then
            echo "=== 0 field anomalies across the whole run ==="
          else
            echo "=== $ANOMALY_TOTAL field anomalies across $ANOMALY_PAIRS store/day pair(s) - see anomaly-pairs.txt ==="
            cat anomaly-pairs.txt
          fi

          if [ "$SKIPPED_PAIRS" -eq 0 ]; then
            echo "=== 0 refunds skipped for belonging to another business date ==="
          else
            echo "=== $SKIPPED_COUNT refund(s) totalling \$$SKIPPED_AMOUNT skipped as belonging to another business date, across $SKIPPED_PAIRS pair(s) ==="
            echo "    (known one-directional bias: these are missing from net entirely, so net runs high by this amount)"
            cat skipped-refunds.txt
          fi

          if [ "$VOID_PAIRS" -eq 0 ]; then
            echo "=== 0 voided discounts excluded ==="
          else
            echo "=== $VOID_COUNT voided discount(s) totalling \$$VOID_AMOUNT excluded across $VOID_PAIRS pair(s) ==="
            echo "    (processingState VOID/PENDING_VOID - correctly not subtracted; counted until 2026-09-16)"
            cat void-discounts.txt
          fi

          echo "ok_count=$OK_COUNT" >> "$GITHUB_OUTPUT"
          echo "fail_count=$FAIL_COUNT" >> "$GITHUB_OUTPUT"
          echo "chunks_with_failures=$CHUNKS_WITH_FAILURES" >> "$GITHUB_OUTPUT"
          echo "anomaly_pairs=$ANOMALY_PAIRS" >> "$GITHUB_OUTPUT"
          echo "anomaly_total=$ANOMALY_TOTAL" >> "$GITHUB_OUTPUT"
          echo "skipped_refund_pairs=$SKIPPED_PAIRS" >> "$GITHUB_OUTPUT"
          echo "skipped_refund_count=$SKIPPED_COUNT" >> "$GITHUB_OUTPUT"
          echo "skipped_refund_amount=$SKIPPED_AMOUNT" >> "$GITHUB_OUTPUT"
          echo "void_discount_pairs=$VOID_PAIRS" >> "$GITHUB_OUTPUT"
          echo "void_discount_count=$VOID_COUNT" >> "$GITHUB_OUTPUT"
          echo "void_discount_amount=$VOID_AMOUNT" >> "$GITHUB_OUTPUT"

      # v6: v4 is stuck on Node 20, which GitHub Actions stopped running by
      # default after the June 2026 Node 24 cutover - v4 runs were starting
      # to fail purely on that, unrelated to anything this workflow does.
      # v6 (like v5) runs on Node 24. No input/output shape changed across
      # this bump (name/path/retention-days/if-no-files-found are the same
      # keys v4 already used) - only the action's own runtime moved.
      - name: Upload logs
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: backfill-sales-${{ github.run_id }}
          path: |
            full-log.txt
            synced-pairs.txt
            failed-pairs.txt
            anomaly-pairs.txt
            skipped-refunds.txt
            void-discounts.txt
          retention-days: 30
          if-no-files-found: error

      - name: Fail job if anything failed
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          if [ "${{ steps.backfill.outputs.fail_count }}" != "0" ]; then
            echo "::error::${{ steps.backfill.outputs.fail_count }} store/day pairs failed across ${{ steps.backfill.outputs.chunks_with_failures }} chunk(s) of ${{ steps.backfill.outputs.chunk_count }}. See the backfill-sales artifact's failed-pairs.txt."
            exit 1
          fi
