# TEMPORAL - borrar junto con app/api/toast/discount-probe/route.js.
#
# Existe por una sola razon: el valor de SYNC_SECRET no se puede leer a mano.
# En Vercel esta marcado como sensitive (ni dashboard ni CLI lo devuelven), y
# rotarlo romperia los workflows porque el secreto de GitHub no se puede
# actualizar. Pero GitHub Actions SI tiene el valor. Asi que la llamada al
# probe se hace desde aqui: el secreto nunca sale de GitHub, nunca toca una
# maquina local, y nunca aparece en la respuesta.
#
# Este workflow no calcula nada y no escribe nada. Hace un GET y sube la
# respuesta tal cual vino. El analisis se hace sobre el artifact.
#
# Uso: Actions -> "Discount probe (TEMPORAL)" -> Run workflow, con
# store_code y business_date. Dos corridas conocidas:
#   10037 / 2026-08-28  (nuestro 848.16 vs Toast 840.84)
#   10001 / 2026-09-14  (nuestro 323.95 vs Toast 316.90)

name: Discount probe (TEMPORAL)

# Solo manual. Sin schedule a proposito: esta ruta lee ordenes crudas de
# Toast y nada deberia poder pegarle en automatico.
on:
  workflow_dispatch:
    inputs:
      store_code:
        description: "Codigo de tienda, p.ej. 10037"
        required: true
      business_date:
        description: "Fecha de negocio YYYY-MM-DD, p.ej. 2026-08-28"
        required: true

# El job no necesita escribir nada en el repo.
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Primero y sin condiciones, misma leccion que backfill-sales.yml: si el
      # archivo solo existiera despues del curl, un fallo anterior dejaria al
      # upload sin nada que subir y el error se reportaria como "No files were
      # found" en vez del error real.
      - name: Preparar archivo de respuesta
        run: ': > response.json'

      # Las entradas se leen por env, no interpoladas dentro del script. Un
      # ${{ }} pegado directo en el shell es inyeccion de comandos: un
      # store_code como `; rm -rf .` se ejecutaria. Por env son datos.
      - name: Validar entradas
        id: input
        env:
          STORE_CODE: ${{ github.event.inputs.store_code }}
          BUSINESS_DATE: ${{ github.event.inputs.business_date }}
        run: |
          if ! [[ "$STORE_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::store_code debe ser un entero, llego: $STORE_CODE"
            exit 1
          fi
          if ! [[ "$BUSINESS_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::business_date debe ser YYYY-MM-DD, llego: $BUSINESS_DATE"
            exit 1
          fi
          echo "store=$STORE_CODE" >> "$GITHUB_OUTPUT"
          echo "date=$BUSINESS_DATE" >> "$GITHUB_OUTPUT"
          echo "Probe: tienda $STORE_CODE, fecha $BUSINESS_DATE"

      - name: Llamar al probe
        env:
          # El secreto entra como variable de entorno y se lee solo aqui
          # abajo. No se imprime, no se escribe a disco, y no va en la URL
          # (un query param terminaria en los logs de acceso del servidor).
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          STORE_CODE: ${{ steps.input.outputs.store }}
          BUSINESS_DATE: ${{ steps.input.outputs.date }}
        run: |
          # Sin set -x en todo el archivo: con xtrace el shell imprimiria la
          # linea del curl ya expandida, con el header y el secreto dentro.
          # Tampoco set -e: los fallos se revisan a mano abajo para poder
          # imprimir el motivo antes de salir, en vez de morir en seco.
          set -u

          if [ -z "${APP_URL:-}" ]; then
            echo "::error::El secreto APP_URL esta vacio."
            exit 1
          fi

          # -o guarda el cuerpo sin tocarlo, -w devuelve solo el status. Nada
          # de -v ni --trace: ambos vuelcan los headers de la peticion, que es
          # exactamente donde viaja el secreto.
          CURL_RC=0
          HTTP=$(curl -sS -m 300 \
            -o response.json \
            -w '%{http_code}' \
            -H "x-sync-secret: $SYNC_SECRET" \
            "$APP_URL/api/toast/discount-probe?storeCode=$STORE_CODE&businessDate=$BUSINESS_DATE") || CURL_RC=$?

          # Un fallo de conexion o un timeout no es un "non-200": curl sale
          # distinto de cero y HTTP queda vacio o en 000. Se reporta aparte
          # para no confundirlo con una respuesta del servidor.
          if [ "$CURL_RC" != "0" ]; then
            echo "::error::curl fallo con exit $CURL_RC (conexion/timeout), sin respuesta HTTP. El detalle va arriba, en stderr de curl."
            exit 1
          fi

          BYTES=$(wc -c < response.json)
          echo "HTTP $HTTP | $BYTES bytes | tienda $STORE_CODE | fecha $BUSINESS_DATE"

          {
            echo "### Discount probe"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tienda | $STORE_CODE |"
            echo "| Fecha | $BUSINESS_DATE |"
            echo "| HTTP | $HTTP |"
            echo "| Bytes | $BYTES |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$HTTP" != "200" ]; then
            echo "::error::discount-probe devolvio HTTP $HTTP para $STORE_CODE / $BUSINESS_DATE"
            # El cuerpo de error del route son cadenas fijas ("No autorizado",
            # validaciones, err.message) - nunca incluye el secreto. Se imprime
            # entero para que un fallo sea diagnosticable y no un numero suelto.
            echo "--- cuerpo de la respuesta ---"
            cat response.json
            echo ""
            echo "------------------------------"
            {
              echo ""
              echo "Fallo. Cuerpo de la respuesta:"
              echo '```'
              cat response.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Ruta exacta, nunca un glob: un patron podria arrastrar cualquier otro
      # archivo que quedara en el workspace. Aqui solo puede subir este.
      # if: always() para que un fallo tambien deje el cuerpo descargable.
      - name: Subir respuesta cruda
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discount-probe-${{ steps.input.outputs.store }}-${{ steps.input.outputs.date }}
          path: response.json
          if-no-files-found: error
          retention-days: 7
